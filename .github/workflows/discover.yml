name: Discover career boards

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

concurrency:
  group: poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Discover and verify career boards
        run: uv run python -m poller.tools.discover --max-candidates 500

      - name: Upload registry candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: registry-candidates
          path: data/registry_candidates.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit discovery catalog
        run: |
          git add data/discovered_boards.json data/company_identities.json
          if git diff --cached --quiet; then
            echo "No discovery changes"
            exit 0
          fi
          git config user.name "nightjar-bot"
          git config user.email "nightjar-bot@users.noreply.github.com"
          git commit -m "discovery: update career board catalog"
          git push
