[project]
name = "nightjar-poller"
version = "0.1.0"
description = "Open internship feed poller — fetches, normalizes, dedupes job postings from ATS boards"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[project.scripts]
poll = "poller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poller"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["poller/tests"]
markers = [
    "live: marks tests that hit real APIs (deselect with '-m \"not live\"')",
]
asyncio_mode = "auto"
