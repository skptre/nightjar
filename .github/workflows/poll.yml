name: Poll ATS feeds

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run poller
        run: uv run python -m poller --once

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "nightjar-bot"
          git config user.email "nightjar-bot@users.noreply.github.com"
          COMMIT_MSG="poll: automated feed update"
          if [ -f data/commit_msg.txt ]; then
            COMMIT_MSG=$(cat data/commit_msg.txt)
            rm data/commit_msg.txt
          fi
          git add data/
          git commit -m "$COMMIT_MSG"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          user_name: 'nightjar-bot'
          user_email: 'nightjar-bot@users.noreply.github.com'
