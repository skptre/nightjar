name: Report a problem
description: Help improve Nightjar during the beta
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Please leave out personal notes, contact details, and workspace backups. Reports are public. Optional diagnostics can be saved and reviewed in Settings.'
  - type: input
    id: version
    attributes:
      label: Nightjar version
      description: Shown in Settings under App updates
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: posting
    attributes:
      label: Posting ID or public employer link (optional)
  - type: textarea
    id: environment
    attributes:
      label: Device and optional diagnostics
      description: Windows version, screen size, and any relevant technical details
