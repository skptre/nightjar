<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightjar</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Find internships and early-career roles. Keep your applications, dates and notes in one private workspace." />
    <link rel="icon" type="image/svg+xml" href="/nightjar.svg" />
    <script>
      try {
        const theme = localStorage.getItem('nightjar_theme') || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
