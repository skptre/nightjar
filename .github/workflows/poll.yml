name: Poll ATS feeds

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      approve_drop:
        description: 'Reviewed provider:company count drop (optional, one source)'
        required: false
        type: string
  repository_dispatch:
    types: [poll-feed]

concurrency:
  group: poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run poller
        id: poller
        continue-on-error: true
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY || secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          APPROVE_DROP: ${{ inputs.approve_drop }}
        shell: bash
        run: |
          args=(--once --fail-on-degraded)
          if [ -n "$APPROVE_DROP" ]; then args+=(--approve-drop "$APPROVE_DROP"); fi
          uv run python -m poller "${args[@]}"

      - name: Record source health
        if: always()
        shell: bash
        run: |
          echo '### Collection health' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          uv run python -m poller.tools.health >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve discovery candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-candidates
          path: data/registry_candidates.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate publication
        run: uv run python -m poller.tools.validate_publication

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "nightjar-bot"
          git config user.email "nightjar-bot@users.noreply.github.com"
          COMMIT_MSG="poll: automated feed update"
          if [ -f data/commit_msg.txt ]; then
            COMMIT_MSG=$(cat data/commit_msg.txt)
            rm data/commit_msg.txt
          fi
          git add data/
          git commit -m "$COMMIT_MSG"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          user_name: 'nightjar-bot'
          user_email: 'nightjar-bot@users.noreply.github.com'

      - name: Fail visibly after preserving usable discoveries
        if: always() && steps.poller.outcome == 'failure'
        run: exit 1
